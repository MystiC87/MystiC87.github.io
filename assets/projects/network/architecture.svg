<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img"><title>NETWORK COMBAT</title><rect width="720" height="640" fill="#171c22"/><g font-family="Segoe UI, Malgun Gothic, sans-serif"><text x="40" y="48" fill="#ee795b" font-size="14" letter-spacing="2">NETWORK COMBAT</text><text x="40" y="80" fill="#f4f1ea" font-size="22">의도 전송부터 화면 반영까지</text><rect x="40" y="116" width="640" height="72" rx="4" fill="#242b32" stroke="#49515a"/><text x="64" y="145" fill="#f4f1ea" font-size="21">Unity · Command</text><text x="64" y="169" fill="#b6c1cb" font-size="14">입력과 전투 의도 전송</text><path d="M360 192v19m-5-5 5 5 5-5" fill="none" stroke="#ee795b" stroke-width="2"/><rect x="40" y="216" width="640" height="72" rx="4" fill="#242b32" stroke="#49515a"/><text x="64" y="245" fill="#f4f1ea" font-size="21">Rust · Authority</text><text x="64" y="269" fill="#b6c1cb" font-size="14">세션 / 전투 판정 / 상태 결정</text><path d="M360 292v19m-5-5 5 5 5-5" fill="none" stroke="#ee795b" stroke-width="2"/><rect x="40" y="316" width="640" height="72" rx="4" fill="#242b32" stroke="#49515a"/><text x="64" y="345" fill="#f4f1ea" font-size="21">Delta · Event · Correction</text><text x="64" y="369" fill="#b6c1cb" font-size="14">상태 변경 / 표현 이벤트 / 상태 보정</text><path d="M360 392v19m-5-5 5 5 5-5" fill="none" stroke="#ee795b" stroke-width="2"/><rect x="40" y="416" width="640" height="72" rx="4" fill="#242b32" stroke="#49515a"/><text x="64" y="445" fill="#f4f1ea" font-size="21">Unity · Receive queue</text><text x="64" y="469" fill="#b6c1cb" font-size="14">비동기 수신 → 메인 스레드 적용</text><path d="M360 492v19m-5-5 5 5 5-5" fill="none" stroke="#ee795b" stroke-width="2"/><rect x="40" y="516" width="640" height="72" rx="4" fill="#242b32" stroke="#49515a"/><text x="64" y="545" fill="#f4f1ea" font-size="21">Presentation</text><text x="64" y="569" fill="#b6c1cb" font-size="14">UI / 애니메이션 / 로컬 복귀</text></g></svg>