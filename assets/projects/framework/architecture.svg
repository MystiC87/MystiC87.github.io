<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img"><title>RENDER CONTRACT</title><rect width="720" height="540" fill="#171c22"/><g font-family="Segoe UI, Malgun Gothic, sans-serif"><text x="40" y="48" fill="#ee795b" font-size="14" letter-spacing="2">RENDER CONTRACT</text><text x="40" y="80" fill="#f4f1ea" font-size="22">게임 코드와 그래픽 API의 경계</text><rect x="40" y="116" width="640" height="72" rx="4" fill="#242b32" stroke="#49515a"/><text x="64" y="145" fill="#f4f1ea" font-size="21">Game · HUDSnapshot</text><text x="64" y="169" fill="#b6c1cb" font-size="14">고정 틱으로 갱신한 게임 상태</text><path d="M360 192v19m-5-5 5 5 5-5" fill="none" stroke="#ee795b" stroke-width="2"/><rect x="40" y="216" width="640" height="72" rx="4" fill="#242b32" stroke="#49515a"/><text x="64" y="245" fill="#f4f1ea" font-size="21">RenderContext → RenderCommand</text><text x="64" y="269" fill="#b6c1cb" font-size="14">Sprite / FillRect / Line / Text</text><path d="M360 292v19m-5-5 5 5 5-5" fill="none" stroke="#ee795b" stroke-width="2"/><rect x="40" y="316" width="640" height="72" rx="4" fill="#242b32" stroke="#49515a"/><text x="64" y="345" fill="#f4f1ea" font-size="21">RenderSystem</text><text x="64" y="369" fill="#b6c1cb" font-size="14">화면 좌표 / 색 / 제출 순서 공통 계약</text><path d="M360 392v19m-5-5 5 5 5-5" fill="none" stroke="#ee795b" stroke-width="2"/><rect x="40" y="416" width="640" height="72" rx="4" fill="#242b32" stroke="#49515a"/><text x="64" y="445" fill="#f4f1ea" font-size="21">Direct3D 9  |  Direct3D 11</text><text x="64" y="469" fill="#b6c1cb" font-size="14">각 백엔드가 공통 명령을 실제 API 호출로 변환</text></g></svg>