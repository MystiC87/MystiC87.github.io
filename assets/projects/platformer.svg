<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img"><title>PLAYER STATE</title><rect width="720" height="540" fill="#171c22"/><g font-family="Segoe UI, Malgun Gothic, sans-serif"><text x="40" y="48" fill="#ee795b" font-size="14" letter-spacing="2">PLAYER STATE</text><text x="40" y="80" fill="#f4f1ea" font-size="22">폼 전환과 상호작용</text><rect x="40" y="116" width="640" height="72" rx="4" fill="#242b32" stroke="#49515a"/><text x="64" y="145" fill="#f4f1ea" font-size="21">Item / Damage</text><text x="64" y="169" fill="#b6c1cb" font-size="14">아이템 획득 또는 피격</text><path d="M360 192v19m-5-5 5 5 5-5" fill="none" stroke="#ee795b" stroke-width="2"/><rect x="40" y="216" width="640" height="72" rx="4" fill="#242b32" stroke="#49515a"/><text x="64" y="245" fill="#f4f1ea" font-size="21">PlayerFormController</text><text x="64" y="269" fill="#b6c1cb" font-size="14">Small / Big / Fire 전환 요청</text><path d="M360 292v19m-5-5 5 5 5-5" fill="none" stroke="#ee795b" stroke-width="2"/><rect x="40" y="316" width="640" height="72" rx="4" fill="#242b32" stroke="#49515a"/><text x="64" y="345" fill="#f4f1ea" font-size="21">Transition lock · Invincibility</text><text x="64" y="369" fill="#b6c1cb" font-size="14">중복 전환 방지 / 전환 잠금 / 무적 시간</text><path d="M360 392v19m-5-5 5 5 5-5" fill="none" stroke="#ee795b" stroke-width="2"/><rect x="40" y="416" width="640" height="72" rx="4" fill="#242b32" stroke="#49515a"/><text x="64" y="445" fill="#f4f1ea" font-size="21">Player · Collider · Animator</text><text x="64" y="469" fill="#b6c1cb" font-size="14">이동 / 충돌 크기 / 애니메이션에 반영</text></g></svg>